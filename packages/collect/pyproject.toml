[project]
name = "gifts-collect"
version = "0.1.0"
description = "gift_regression data scraper"
readme = "README.md"
authors = [
    { name = "touchme", email = "vodkavoid@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
gifts-collect = "gifts_collect:start"
