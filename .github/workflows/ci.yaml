name: Lint, Type Check & Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv
        run: pip install --upgrade uv

      - name: Install workspace & dev dependencies
        run: uv sync --all-packages --group dev

      - name: Ruff - Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Bandit - Security Scan
        run: uv run bandit -r . -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: MyPy - Type Check
        run: uv run mypy . --ignore-missing-imports || true

      - name: Run tests with coverage
        run: uv run pytest --cov --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml

  collect:
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: ver
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/collect.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            touchmeangel/gifts_collect:${{ steps.ver.outputs.version }}
            touchmeangel/gifts_collect:latest